spring.application.name=stocksmart-backend-test

# Use in-memory H2 database for isolated testing
spring.datasource.url=jdbc:h2:mem:stocksmart;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret (at least 256 bits)
jwt.secret=test_jwt_secret_key_minimum_256_bits_for_unit_tests_abcdef1234567890
jwt.expiration=86400000

# CORS for test
cors.allowed-origins=http://localhost:4200,http://localhost:5173
