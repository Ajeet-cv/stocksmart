services:
  # ---------------------------------------------------------------------------
  # StockSmart Backend Web Service (Docker / Java 21 / Spring Boot 4)
  # ---------------------------------------------------------------------------
  - type: web
    name: stocksmart-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # ---------------------------------------------------------------------------
  # StockSmart Frontend Static Site (Angular 22)
  # ---------------------------------------------------------------------------
  - type: web
    name: stocksmart-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      # Angular SPA Client-Side Routing rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
